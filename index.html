    catalogAll:'Showing {count} sample parts',catalogFiltered:'Showing {count} sample parts matching {vehicle}',filterActive:'Vehicle filter active',

    aboutEyebrow:'ABOUT THE WORK',aboutTitle:'A prototype built around a real product challenge',aboutBody:'I designed and developed this technical showcase to demonstrate vehicle-based product discovery, the concept of part-to-vehicle fitment, responsive UX, and accurate Persian/English layout switching. This is an interactive prototype, not a completed client store.',

    added:'Added to the demonstration cart.',cartCleared:'Demonstration cart cleared.',fitmentApplied:'Vehicle compatibility filter applied.',yearLabel:'Solar Hijri year'
  }
};
const $ = id => document.getElementById(id);
const escapeHTML = v => String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const state = {lang:'fa',make:'',model:'',year:'',trim:'',vehicle:null,category:'all',search:'',sort:'default',cart:new Map()};
let toastTimer;
function getText(key){return TEXT[state.lang][key] || key}
function format(value){return Number(value).toLocaleString(state.lang === 'fa' ? 'fa-IR' : 'en-US')}
function money(value){return format(value)+' '+getText('currency')}
function named(value){return value[state.lang]}
function vehicleName(v){return [named(v.make),named(v.model),format(v.year),named(v.trim)].join(' / ')}
function fillSelect(id,placeholder,options,value=''){
  const el=$(id);el.replaceChildren();
  const first=document.createElement('option');first.value='';first.textContent=getText(placeholder);el.append(first);
  options.forEach(([v,label])=>{const opt=document.createElement('option');opt.value=v;opt.textContent=label;el.append(opt)});
  el.disabled=options.length===0;el.value=options.some(([v])=>v===value)?value:'';
}
function uniqueLocalized(field,vehicles){
  const found=new Map();for (const v of vehicles){const obj=v[field];const key=obj.fa;if(!found.has(key))found.set(key,[key,obj[state.lang]]);}return [...found.values()];
}
function populateVehicleSelectors(){
  fillSelect('vehicle-make','selectMake',uniqueLocalized('make',VEHICLES),state.make);
  const byMake=VEHICLES.filter(v=>v.make.fa===state.make);
  fillSelect('vehicle-model','selectModel',uniqueLocalized('model',byMake),state.model);
  const byModel=byMake.filter(v=>v.model.fa===state.model);
  fillSelect('vehicle-year','selectYear',[...new Set(byModel.map(v=>v.year))].map(v=>[v,format(v)]),state.year);
  const byYear=byModel.filter(v=>v.year===state.year);
  fillSelect('vehicle-trim','selectTrim',uniqueLocalized('trim',byYear),state.trim);
  $('apply-fitment').disabled=!(state.make&&state.model&&state.year&&state.trim);
}
function renderLanguage(){
  document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='fa'?'rtl':'ltr';
  document.body.dir=document.documentElement.dir;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=getText(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    // The dictionary contains only hand-authored static headings with em and br tags.
    el.innerHTML=getText(el.dataset.i18nHtml);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=getText(el.dataset.i18nPlaceholder));
  $('lang-label').textContent=state.lang==='fa'?'English':'فارسی';
  $('lang-toggle').setAttribute('aria-label',state.lang==='fa'?'Switch to English':'تغییر زبان به فارسی');
  document.title=state.lang==='fa'?'PartSync | نمونه فروشگاه قطعات خودرو — مهدی شوقی‌نژاد':'PartSync | Automotive Parts Demo — Mahdi Shoghinezhad';
  populateVehicleSelectors();renderCategories();renderCatalog();renderCart();
  $('vehicle-status').textContent=state.vehicle?getText('vehicleSelected')+' '+vehicleName(state.vehicle):'';
}
function renderCategories(){
  const target=$('category-wrap');target.replaceChildren();
  for(const cat of CATEGORIES){const btn=document.createElement('button');btn.type='button';btn.className='category-pill'+(state.category===cat?' active':'');btn.textContent=getText(cat);btn.dataset.category=cat;btn.setAttribute('aria-pressed',String(state.category===cat));btn.addEventListener('click',()=>{state.category=cat;renderCategories();renderCatalog()});target.append(btn);}
}
function filteredProducts(){
  const q=state.search.trim().toLocaleLowerCase();
  const filtered=PRODUCTS.filter(p=>{
    if(state.vehicle && !p.fit.includes(state.vehicle.id))return false;
    if(state.category!=='all' && p.category!==state.category)return false;
    if(!q)return true;
    const text=[p.sku,p.name.fa,p.name.en,p.brand.fa,p.brand.en,getText(p.category)].join(' ').toLocaleLowerCase();
    return text.includes(q);
  });
  if(state.sort==='priceAsc')filtered.sort((a,b)=>a.price-b.price);
  if(state.sort==='priceDesc')filtered.sort((a,b)=>b.price-a.price);
  return filtered;
}
function renderCatalog(){
  const rows=filteredProducts();
  $('catalog-subtitle').textContent=(state.vehicle?getText('catalogFiltered'):getText('catalogAll'))
    .replace('{count}',format(rows.length)).replace('{vehicle}',state.vehicle?vehicleName(state.vehicle):'');
  $('fitment-chip').hidden=!state.vehicle;
  $('clear-filters').hidden=!(state.vehicle||state.category!=='all'||state.search);
  const grid=$('product-grid');grid.replaceChildren();
  if(!rows.length){const empty=document.createElement('div');empty.className='empty-state';empty.textContent=getText('empty');grid.append(empty);return}
  for(const p of rows){const card=document.createElement('article');card.className='product-card';
    card.innerHTML=`<div class="product-illustration"><span class="product-badge ${state.vehicle?'':'base'}">${escapeHTML(getText(state.vehicle?'compatible':'demoProduct'))}</span><div class="part-glyph" aria-hidden="true">${escapeHTML(p.icon)}</div></div><div class="product-body"><div class="product-brand">${escapeHTML(named(p.brand))} · ${escapeHTML(getText(p.category))}</div><h3 class="product-name">${escapeHTML(named(p.name))}</h3><div class="product-sku">${escapeHTML(getText('partCode'))}: ${escapeHTML(p.sku)}</div><div class="product-divider"></div><div class="product-bottom"><div class="product-price">${format(p.price)} <small>${escapeHTML(getText('currency'))}</small></div><button type="button" class="add-btn" aria-label="${escapeHTML(getText('addToCart')+' '+named(p.name))}">+</button></div></div>`;
    card.querySelector('.add-btn').addEventListener('click',()=>addCart(p.id));grid.append(card);
  }
}
function addCart(id){state.cart.set(id,(state.cart.get(id)||0)+1);renderCart();showToast(getText('added'))}
function renderCart(){
  const count=[...state.cart.values()].reduce((a,b)=>a+b,0);
  $('cart-count').textContent=format(count);
  const root=$('cart-items');root.replaceChildren();let total=0;
  for(const [id,qty] of state.cart){const p=PRODUCTS.find(p=>p.id===id);if(!p)continue;total+=qty*p.price;
    const el=document.createElement('div');el.className='cart-line';el.innerHTML=`<div><strong>${escapeHTML(named(p.name))}</strong><small>${escapeHTML(p.sku)}</small><small>${escapeHTML(money(p.price))}</small></div><div class="quantity-controls"><button type="button" aria-label="Decrease quantity">−</button><span>${format(qty)}</span><button type="button" aria-label="Increase quantity">+</button></div>`;
    const btns=el.querySelectorAll('button');btns[0].addEventListener('click',()=>changeQty(id,-1));btns[1].addEventListener('click',()=>changeQty(id,1));root.append(el);
  }
  if(!state.cart.size){const empty=document.createElement('div');empty.className='cart-empty';empty.textContent=getText('cartEmpty');root.append(empty)}
  $('cart-total').textContent=money(total);$('cart-clear').disabled=!state.cart.size;
}
function changeQty(id,delta){const next=(state.cart.get(id)||0)+delta;if(next<=0)state.cart.delete(id);else state.cart.set(id,next);renderCart()}
function showToast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function openCart(){const overlay=$('overlay');overlay.hidden=false;$('cart-drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('cart-close').focus()}
function closeCart(){const overlay=$('overlay');overlay.hidden=true;$('cart-drawer').setAttribute('aria-hidden','true');document.body.style.overflow='';$('cart-open').focus()}
$('vehicle-make').addEventListener('change',e=>{state.make=e.target.value;state.model=state.year=state.trim='';populateVehicleSelectors()});
$('vehicle-model').addEventListener('change',e=>{state.model=e.target.value;state.year=state.trim='';populateVehicleSelectors()});
$('vehicle-year').addEventListener('change',e=>{state.year=e.target.value;state.trim='';populateVehicleSelectors()});
$('vehicle-trim').addEventListener('change',e=>{state.trim=e.target.value;populateVehicleSelectors()});
$('apply-fitment').addEventListener('click',()=>{
  const selected=VEHICLES.find(v=>v.make.fa===state.make&&v.model.fa===state.model&&v.year===state.year&&v.trim.fa===state.trim);
  if(!selected)return;state.vehicle=selected;state.category='all';state.search='';$('catalog-search').value='';
  $('vehicle-status').textContent=getText('vehicleSelected')+' '+vehicleName(selected);renderCategories();renderCatalog();showToast(getText('fitmentApplied'));
  $('catalog').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
});
$('catalog-search').addEventListener('input',e=>{state.search=e.target.value;renderCatalog()});
$('catalog-sort').addEventListener('change',e=>{state.sort=e.target.value;renderCatalog()});
$('clear-filters').addEventListener('click',()=>{state.vehicle=null;state.category='all';state.search='';$('catalog-search').value='';$('vehicle-status').textContent='';renderCategories();renderCatalog()});
$('lang-toggle').addEventListener('click',()=>{state.lang=state.lang==='fa'?'en':'fa';renderLanguage()});
$('cart-open').addEventListener('click',openCart);$('cart-close').addEventListener('click',closeCart);$('overlay').addEventListener('click',closeCart);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('cart-drawer').getAttribute('aria-hidden')==='false')closeCart()});
$('cart-clear').addEventListener('click',()=>{state.cart.clear();renderCart();showToast(getText('cartCleared'))});
renderLanguage();

</script>
